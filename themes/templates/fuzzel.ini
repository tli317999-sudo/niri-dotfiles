## ────────────────────────────────────────────
## fuzzel — Catppuccin Mocha
## 颜色格式是 RRGGBBAA，不带 "#"
## ────────────────────────────────────────────

[main]
font=JetBrainsMono Nerd Font:size=12
prompt="  "
icons-enabled=yes
icon-theme=Papirus-Dark
terminal=konsole -e
lines=12
width=44
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=24
anchor=center
layer=overlay

[colors]
background={{base}}f2
text={{text}}ff
prompt={{blue}}ff
placeholder={{overlay0}}ff
input={{text}}ff
match={{blue}}ff
selection={{surface0}}ff
selection-text={{text}}ff
selection-match={{purple}}ff
counter={{overlay0}}ff
border={{blue}}66

[border]
width=1
radius=12
